[env]
MISE_USE_VERSIONS_HOST = "0"

[plugins]
luarocks = "./"

[tools]
"aqua:owenlamont/ryl" = "latest"
"npm:@commitlint/cli" = "latest"
actionlint = "latest"
editorconfig-checker = "latest"
ghalint = "latest"
hk = "latest"
lua = "5.4"
lua-language-server = "latest"
oxfmt = "latest"
pkl = "latest"
shellcheck = "latest"
shfmt = "latest"
stylua = "latest"
zizmor = "latest"

[tools."github:Kampfkarren/selene"]
version = "latest"
bin = "selene"

[tools."luarocks:luacheck"]
version = "latest"
depends = ["lua"]

[tasks.ci]
description = "Run all CI checks"
depends = ["lint", "test"]

[tasks.format]
description = "Format Lua scripts"
run = "stylua metadata.lua hooks/"

[tasks.lint]
description = "Lint Lua scripts and GitHub Actions using hk"
run = "hk check"

[tasks.lint-fix]
description = "Fix linting issues"
run = "hk fix"
